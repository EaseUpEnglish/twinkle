<style>

.ph{font-size:64px}

.intro .hrow{flex-direction:column;margin-top:4px}.intro #hero{width:230px;height:250px}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(#2c1a73,#1c0f52);border-top:3px solid var(--gold);border-radius:24px 24px 0 0}

.card{height:64px;display:flex;align-items:center;gap:10px;padding:0 12px;border-radius:18px;background:linear-gradient(#4a2db0,#35207a);border:3px solid var(--gold);font-size:19px}

.card.done{background:#1f6b4d;border-color:#46d28a;box-shadow:0 0 16px #46d28a88}.card.done .bd{display:block}
.shake{animation:sh .35s}.hint{animation:pl .7s infinite}

.ghost{position:fixed;z-index:50;pointer-events:none;width:80px;height:64px}

.btn{display:block;width:100%;margin-top:16px;border:4px solid var(--gold);border-radius:999px;padding:12px;font:inherit;font-size:24px;font-weight:700;cursor:pointer;color:#fff;text-shadow:0 2px 0 #0b6b63;background:linear-gradient(#4ae8d8,#13b0a2);box-shadow:0 6px 0 #0b6b63,0 10px 16px #0006}

.abc{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:12px 0}.abc .tile{height:48px;font-size:28px;cursor:default}.abc .tile.weak{opacity:.4;border-style:dashed;box-shadow:none}

.speaker{width:112px;height:112px;border-radius:50%;border:4px solid var(--gold);background:linear-gradient(#4ae8d8,#13b0a2);box-shadow:0 6px 0 #0b6b63;cursor:pointer;display:block;margin:10px auto;padding:0}.speaker img{width:70px}.speaker:active{transform:translateY(4px)}
.rep .chip{display:inline-block;margin:4px 4px 0 0;padding:6px 12px;border-radius:12px;background:#3a2a78;color:var(--ink)}

 L=LESSONS.find(x=>x.id===id);R={id,stars:0,weak:new Set()};live=false;

function begin(){touchDay();live=true;R={id:L.id,stars:0,weak:new Set()};L.id==="abc"?abcRound(0):L.kind==="vis"?vsStart():mcStart()}

/* ===== УРОК 1: БУКВЫ (перетаскивание) ===== */
let A={},sel=null,drag=null;
function abcRound(r){
 const ps=PAIRS.slice(ROUNDS[r][0],ROUNDS[r][1]);A={r,tries:{},errs:0,done:0,total:ps.length};sel=null;
 frame(`<div class="board"><div class="col" id="Lc"></div><div class="col" id="Rc"></div></div><div id="foot"></div>`);
 hero("surprise");say(`Раунд ${r+1} из ${ROUNDS.length}. Найди пары!`);
 shuffle(ps).forEach(p=>{const i=PAIRS.indexOf(p),t=document.createElement("div");t.className="tile";t.dataset.l=p[0];t.style.setProperty("--c",col(i));t.textContent=p[0];
  t.style.transform=`rotate(${Math.round(Math.random()*12-6)}deg)`;t.style.marginLeft=Math.round(Math.random()*18)+"px";t.onpointerdown=e=>tileDown(e,t);$("Lc").appendChild(t)});
 shuffle(ps).forEach(p=>{const i=PAIRS.indexOf(p),c=document.createElement("div");c.className="card";c.dataset.l=p[0];c.style.setProperty("--c",col(i));
  c.innerHTML=`<span class="em">${p[3]}</span><span>${p[2]}</span><span class="bd">${p[0]}</span>`;c.onclick=()=>{if(sel)attempt(sel,c)};$("Rc").appendChild(c)})}
function tileDown(e,t){if(t.classList.contains("done"))return;e.preventDefault();drag={t,x:e.clientX,y:e.clientY,moved:false,g:null}}
window.addEventListener("pointermove",e=>{if(!drag)return;
 if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8){drag.moved=true;const g=drag.t.cloneNode(true);g.classList.add("ghost");g.style.cssText="transform:none;margin:-32px 0 0 -40px";document.body.appendChild(g);drag.g=g;drag.t.style.opacity=.3}
 if(drag.g){drag.g.style.left=e.clientX+"px";drag.g.style.top=e.clientY+"px"}});
window.addEventListener("pointerup",e=>{if(!drag)return;const {t,moved,g}=drag;drag=null;if(g)g.remove();
 if(moved){t.style.opacity="";const c=document.elementFromPoint(e.clientX,e.clientY);const cd=c&&c.closest(".card");if(cd)attempt(t,cd)}
 else{document.querySelectorAll(".tile.sel").forEach(x=>x.classList.remove("sel"));if(sel===t)sel=null;else{sel=t;t.classList.add("sel")}}});
function attempt(t,c){
 if(c.classList.contains("done")||t.classList.contains("done"))return;
 const l=t.dataset.l,p=PAIRS.find(x=>x[0]===l);document.querySelectorAll(".hint").forEach(x=>x.classList.remove("hint"));
 if(c.dataset.l===l){fb(1);t.classList.add("done");t.classList.remove("sel");c.classList.add("done");sel=null;
  const first=!A.tries[l],add=first?1:0;R.stars+=add;A.done++;speak(l+". "+p[2],l.toLowerCase()+"_"+p[2].toLowerCase());if(add)fly(c,add);else $("sc").textContent=bankVal();
  hero(first?"thumbs_up":"happy");say(`${l} — ${p[2]}! ${first?"Отлично! +1 ⭐":"Молодец!"}`);
  if(A.done===A.total)setTimeout(abcEnd,1200)}
 else{fb(0);A.tries[l]=(A.tries[l]||0)+1;A.errs++;R.weak.add(l);sel=null;t.classList.remove("sel");
  c.classList.remove("shake");void c.offsetWidth;c.classList.add("shake");hero("try_again");say("Попробуй ещё раз!");
  if(A.tries[l]>=2)document.querySelector(`.card[data-l="${l}"]`).classList.add("hint")}}
function abcEnd(){
 const perfect=A.errs===0;if(perfect)R.stars+=BONUS_PART;$("sc").textContent=bankVal();
 hero(perfect?"reward":"happy");say(perfect?`Без ошибок! Бонус +${BONUS_PART} ⭐`:"Раунд пройден! Молодцы!");
 const last=A.r===ROUNDS.length-1;
 $("foot").innerHTML=`<button class="btn" onclick="${last?"abcResult()":`abcRound(${A.r+1})`}">${last?"Результат":"Дальше"}</button>`}
function abcResult(){
 finish(`<div class="abc">${PAIRS.map((p,i)=>`<div class="tile ${R.weak.has(p[0])?"weak":""}" style="--c:${col(i)}">${p[0]}</div>`).join("")}</div>`)}

/* ===== УРОКИ 2 И 3: ТЕСТ НА ПЕРЕВОД ===== */
let M={};
function mcStart(){M={b:0,i:0,tries:0,errs:0};mcQ()}
function mcQ(){
 const it=L.items[M.i],[a,b]=L.blocks[M.b],ok=k=>k!==M.i&&!(SYN[it[0]]||[]).includes(L.items[k][0]);
 let pool=L.items.map((x,k)=>k).filter(k=>ok(k)&&k>=a&&k<b);
 if(pool.length<2)pool=pool.concat(shuffle(L.items.map((x,k)=>k).filter(k=>ok(k)&&!(k>=a&&k<b))));
 const opts=shuffle([it[1],...shuffle(pool).slice(0,2).map(k=>L.items[k][1])]);M.tries=0;
 frame(`<div class="prog"><i style="width:${M.i/L.items.length*100}%"></i></div><p class="center">Вопрос ${M.i+1} из ${L.items.length}</p>
  <div class="word">${it[0]}</div><p class="center"><button class="link" onclick="hear()"><img src="img/icons/speaker.png" width="34" style="vertical-align:middle" alt=""> Послушать</button></p><p class="center">Что это значит?</p>
  ${opts.map(o=>`<button class="opt" onclick="mcPick(this)">${o}</button>`).join("")}<div id="foot"></div>`);
 if(M.i===a){hero("surprise");say(a===0?"Поехали! Выбери перевод.":"Следующая часть!")}else{hero("think");say("Как это переводится?")}}
function mcPick(btn){
 const it=L.items[M.i],ok=btn.textContent===it[1],all=document.querySelectorAll(".opt");
 const nxt=()=>{const end=M.i===L.blocks[M.b][1]-1;$("foot").innerHTML=`<button class="btn" onclick="mcNext()">${end?"Дальше":"Следующий вопрос"}</button>`};
 if(ok){fb(1);all.forEach(x=>x.disabled=true);btn.classList.add("ok");const add=M.tries===0?1:0;R.stars+=add;if(add)fly(btn,add);else $("sc").textContent=bankVal();speak(it[0],slug(it[0]));
  hero(M.tries===0?"thumbs_up":"happy");say(M.tries===0?"Отлично! +1 ⭐":"Молодец!");nxt()}
 else{fb(0);btn.classList.add("bad");btn.disabled=true;M.tries++;M.errs++;R.weak.add(it[0]);
  if(M.tries===1){hero("try_again");say("Hmm... Попробуй ещё раз!")}
  else{all.forEach(x=>{x.disabled=true;if(x.textContent===it[1])x.classList.add("ok")});hero("think");say(`Запомним: ${it[0]} — ${it[1]}`);nxt()}}}
function mcNext(){
 const [a,b]=L.blocks[M.b];
 if(M.i===b-1&&!M.shown){ // конец части
  const perfect=![...R.weak].some(w=>L.items.slice(a,b).some(x=>x[0]===w));if(perfect)R.stars+=BONUS_PART;$("sc").textContent=bankVal();
  M.shown=true;hero(perfect?"reward":"happy");say(perfect?`Часть без ошибок! Бонус +${BONUS_PART} ⭐`:"Часть пройдена! Молодец!");
  const last=M.b===L.blocks.length-1;$("foot").innerHTML=`<button class="btn" onclick="mcNext()">${last?"Результат":"Дальше"}</button>`;return}
 if(M.shown){M.shown=false;if(M.b===L.blocks.length-1)return finish("");M.b++}
 M.i++;(L.kind==="vis"?vsQ:mcQ)()}

/* ===== РАЗДЕЛЫ 4-6: ЦИФРЫ, ЖИВОТНЫЕ, ЦВЕТА (игры с картинками) ===== */
const picOf=vis;
const PROMPT={count:"Сколько звёздочек?",missing:"Какой цифры не хватает?",shadow:"Кто спрятался?",
 hear:{digit:"Какую цифру ты услышал?",emoji:"Кого ты услышал?",color:"Какой цвет ты услышал?"},
 see:{emoji:"Кто это?",color:"Какого цвета?"}};
function vsStart(){M={b:0,i:0,tries:0,errs:0};if(L.shuffle)L.items=shuffle(L.items);vsQ()}   // shuffle: слова спрашиваются в случайном порядке
function vsQ(){
 const it=L.items[M.i],[a,b]=L.blocks[M.b],mode=L.modes[M.i%L.modes.length],n=M.i+1;M.tries=0;M.mode=mode;
 // варианты ответа: верный + два других (для цифр берём ближайшие числа)
 let pool=L.items.map((x,k)=>k).filter(k=>k!==M.i);
 pool=L.vt==="digit"?pool:pool.filter(k=>k>=a&&k<b).length>=2?pool.filter(k=>k>=a&&k<b):pool;
 const ks=shuffle([M.i,...shuffle(pool).slice(0,(L.nopts||3)-1)]);
 let stage="",asWord=mode==="see"||mode==="shadow";
 if(mode==="count")stage=`<div class="stars">${"⭐".repeat(n)}</div>`;
 else if(mode==="missing"){const seq=n===1?["?",2,3]:n===L.items.length?[n-2,n-1,"?"]:[n-1,"?",n+1];stage=`<div class="seq">${seq.map(x=>`<span class="${x==="?"?"q":""}">${x}</span>`).join("")}</div>`}
 else if(mode==="hear")stage=`<button class="speaker" onclick="hear()" aria-label="Послушать"><img src="img/icons/speaker.png" alt=""></button>`;
 else stage=`<div class="bigem ${mode==="shadow"?"shadow":""}" id="stg">${vis(L,it).replace("pi","pi\" style=\"height:140px")}</div>`;
 const q=mode==="hear"?PROMPT.hear[L.vt]:mode==="see"?PROMPT.see[L.vt]:PROMPT[mode];
 const opts=ks.map(k=>`<button class="opt ${asWord?"":L.vt==="digit"?"dg":"pc"}" data-k="${k}" onclick="vsPick(this)">${asWord?L.items[k][0]:L.vt==="digit"?`${L.items[k][2]}<small>${L.items[k][1]}</small>`:picOf(L,L.items[k])}</button>`).join("");
 frame(`<div class="prog"><i style="width:${M.i/L.items.length*100}%"></i></div><p class="center">Вопрос ${M.i+1} из ${L.items.length}</p>
  ${stage}<p class="center">${q}</p><div class="${asWord?"":"og"}${ks.length===4?" og2":""}">${opts}</div><div id="foot"></div>`);
 if(M.i===a){hero("surprise");say(a===0?"Поехали! Выбери ответ.":"Следующая часть!")}else{hero("think");say(mode==="hear"?"Слушай внимательно!":"Подумай хорошенько!")}
 if(mode==="hear")speak(it[0],slug(it[0])+"_en")}
function vsPick(btn){
 const it=L.items[M.i],ok=+btn.dataset.k===M.i,all=document.querySelectorAll(".opt");
 const nxt=()=>{const end=M.i===L.blocks[M.b][1]-1;$("foot").innerHTML=`<button class="btn" onclick="mcNext()">${end?"Дальше":"Следующий вопрос"}</button>`};
 const reveal=()=>{const g=$("stg");if(g)g.classList.remove("shadow")};
 if(ok){fb(1);all.forEach(x=>x.disabled=true);btn.classList.add("ok");reveal();const add=M.tries===0?1:0;R.stars+=add;if(add)fly(btn,add);else $("sc").textContent=bankVal();speak(it[0],slug(it[0]));
  hero(M.tries===0?"thumbs_up":"happy");say(M.tries===0?"Отлично! +1 ⭐":"Молодец!");nxt()}
 else{fb(0);btn.classList.add("bad");btn.disabled=true;M.tries++;M.errs++;R.weak.add(it[0]);
  if(M.tries===1){hero("try_again");say("Hmm... Попробуй ещё раз!")}
  else{all.forEach(x=>{x.disabled=true;if(+x.dataset.k===M.i)x.classList.add("ok")});reveal();hero("think");say(`Запомним: ${it[0]} — ${it[1]}`);speak(it[0],slug(it[0]));nxt()}}}

/* ===== РЕЗУЛЬТАТ ===== */
const label=k=>L.id==="abc"?k+" — "+PAIRS.find(x=>x[0]===k)[2]:L.kind==="vis"?k+" — "+L.items.find(x=>x[0]===k)[1]:k;
const link=k=>L.yt?`https://youtu.be/${L.yt}${k!=null&&L.moments[k]!=null?"?t="+L.moments[k]:""}`:"";
function finish(extra){
 live=false;const flawless=R.weak.size===0;if(flawless)R.stars+=BONUS_LESSON;const p=P.lessons[R.id]||{},first=!p.done;NP=LESSONS.findIndex(l=>l.id===R.id);P.lessons[R.id]={done:true,best:Math.max(p.best||0,R.stars),weak:[...R.weak]};const earn=first?R.stars:Math.floor(R.stars/2);P.wallet=(P.wallet||0)+earn;save();
 const w=[...R.weak];
 api("/result",{name:P.name||"",lesson:L.title,e:L.e,stars:R.stars,max:maxStars(L),weak:w.map(k=>label(k)),all:link(null)})
  .then(r=>{const e=$("sent");if(e&&r&&r.ok)e.textContent="✓ Результат отправлен родителю"});
 frame(`<h1>Урок пройден!</h1><p class="center">Ты набрал ${R.stars} из ${maxStars(L)} ⭐<br><small>Лучший результат: ${P.lessons[R.id].best} из ${maxStars(L)}</small></p><p class="center">⭐ В копилку: +${earn}</p>${flawless?`<p class="center">🎁 Суперприз за урок без ошибок: +${BONUS_LESSON} ⭐</p>`:""}${extra}${first?`<div class="chest" id="chest" onclick="openChest()"><img src="img/icons/chest_closed.png" alt=""><small>Нажми на сундук!</small></div>`:""}<p id="sent" class="center"></p>
  ${w.length?`<div class="rep"><b>Повторим:</b><br>${w.map(k=>!L.yt?`<span class="chip">${label(k)}</span>`:`<button onclick="watch('${k.replace(/'/g,"\\'")}')">${label(k)}</button>`).join("")}<div id="vid"></div></div>`:`<p class="center">Ни одной ошибки, супер!</p>`}
  <button class="btn" onclick="lesson('${R.id}')">Пройти ещё раз</button><button class="btn alt" onclick="home()">В меню</button>`);
 hero("reward");say(first?"Ура! В сундуке что-то есть!":"Ты большой молодец!");confetti();fb(1)}
let NP=0;const PARTS=[["body","Корпус"],["nose","Нос"],["finl","Левое крыло"],["finr","Правое крыло"],["low","Нижний отсек"],["eng","Двигатель"]]
function openChest(){const c=$("chest");if(!c||c.classList.contains("open"))return;const p=PARTS[NP];c.classList.add("open");fb(1);confetti();
 c.innerHTML=p?`<img class="part" src="img/rocket2/t_${p[0]}.png" alt=""><b>Новая деталь ракеты: ${p[1]}!</b><small>Смотри на вкладке «Ракета»</small>`:`<b>Молодец!</b>`;hero("reward");say("Деталь для ракеты твоя!")}
/* ===== ЗАДАНИЕ ДНЯ ===== */
let D={};
const dailyPool=()=>{const a=[];LESSONS.forEach(l=>{if(l.items)l.items.forEach(it=>a.push([it[0],it[1]]))});return a};
function dayStart(){D={q:shuffle(dailyPool()).slice(0,3),i:0,ok:0,tries:0};live=false;dayQ()}
function dayHear(){const w=D.q[D.i][0];speak(w,slug(w)+"_en")}
function dayQ(){
 const it=D.q[D.i],pool=dailyPool().filter(x=>x[1]!==it[1]&&!(SYN[it[0]]||[]).includes(x[0])),opts=shuffle([it[1],...shuffle(pool).slice(0,2).map(x=>x[1])]);D.tries=0;
 frame(`<div class="prog"><i style="width:${D.i/3*100}%"></i></div><p class="center">Задание дня · вопрос ${D.i+1} из 3</p><div class="word">${it[0]}</div><p class="center"><button class="link" onclick="dayHear()"><img src="img/icons/speaker.png" width="34" style="vertical-align:middle" alt=""> Послушать</button></p><p class="center">Что это значит?</p>${opts.map(o=>`<button class="opt" onclick="dayPick(this)">${o}</button>`).join("")}<div id="foot"></div>`);
 hero("think");say("Задание дня! Ты справишься!");dayHear()}
function dayPick(b){
 const it=D.q[D.i],ok=b.textContent===it[1],all=document.querySelectorAll(".opt"),nxt=()=>{$("foot").innerHTML=`<button class="btn" onclick="dayNext()">${D.i===2?"Готово":"Дальше"}</button>`};
 if(ok){fb(1);all.forEach(x=>x.disabled=true);b.classList.add("ok");if(!D.tries)D.ok++;hero(D.tries?"happy":"thumbs_up");say(D.tries?"Молодец!":"Отлично!");nxt()}
 else{fb(0);b.classList.add("bad");b.disabled=true;D.tries++;if(D.tries===1){hero("try_again");say("Попробуй ещё раз!")}else{all.forEach(x=>{x.disabled=true;if(x.textContent===it[1])x.classList.add("ok")});hero("think");say(`Запомним: ${it[0]} — ${it[1]}`);nxt()}}}
function dayNext(){if(D.i<2){D.i++;return dayQ()}dayEnd()}
function dayEnd(){
 const k=dayKey(new Date()),got=P.daily!==k&&(P.freeze||0)<2;P.daily=k;if(got){P.freeze=(P.freeze||0)+1;P.wallet=(P.wallet||0)+2}touchDay();save();
 frame(`<h1>Задание дня выполнено!</h1><p class="center">С первой попытки: ${D.ok} из 3</p><div class="fire"><img src="img/icons/fire.png" alt="">Дней подряд: ${streakNow()}</div>${got?'<p class="center">⭐ +2 звезды и ❄️ заморозка серии! Она спасёт огонёк, если пропустишь день.</p>':""}<button class="btn alt" onclick="home()">На карту</button>`);
 hero("reward");say("Ты большой молодец!");confetti();fb(1)}
function watch(k){const v=$("vid"),m=L.moments[k];
 v.innerHTML=L.yt&&m!=null?`<div class="video"><iframe src="https://www.youtube.com/embed/${L.yt}?start=${m}&autoplay=1&rel=0" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>`:`<p>Видео появится, когда добавим ID и тайминги.</p>`}
/* ===== ВХОД: приветствие, имя, подписка ===== */
let introState=0,pendingChoose=false;
function voice(file,txt,next){
 const a=new Audio("audio/"+file+".mp3");snd=a;
 a.onended=()=>{if(next)next()};
 a.onerror=()=>{if(window.speechSynthesis){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang="ru-RU";u.onend=()=>{if(next)next()};speechSynthesis.speak(u)}else if(next)next()};
 return a.play()}
function introVoice(){ // сразу при запуске; если телефон не разрешает автозвук, сыграет при первом касании
 if(introState)return;introState=1;
 const p=voice("intro","Привет! Это Твинкл!",()=>{introState=2;if(pendingChoose){pendingChoose=false;chooseVoice()}});
 if(p&&p.catch)p.catch(e=>{if(e&&e.name==="NotAllowedError"){introState=0;document.addEventListener("pointerdown",introVoice,{once:true})}})}
function chooseVoice(){if(!document.querySelector(".lc"))return;const p=voice("choose","Давай проверим твои знания! Выбери раздел.");if(p&&p.catch)p.catch(()=>{})}
function afterHome(){if(introState===1)pendingChoose=true;else chooseVoice()}
function intro(){
 live=false;app.className="intro";
 app.innerHTML=`<div class="scene"><div class="top"><b>Twinkle</b>${hudHTML(false)}</div>
 <i class="tw" style="left:8%;top:14%;animation-delay:0s;font-size:22px">✦</i><i class="tw" style="left:86%;top:12%;animation-delay:0.5s;font-size:26px">✦</i><i class="tw" style="left:20%;top:30%;animation-delay:1.1s;font-size:16px">✦</i><i class="tw" style="left:78%;top:34%;animation-delay:1.6s;font-size:20px">✦</i><i class="tw" style="left:6%;top:46%;animation-delay:0.3s;font-size:18px">✦</i><i class="tw" style="left:90%;top:52%;animation-delay:1.2s;font-size:16px">✦</i><i class="tw" style="left:14%;top:66%;animation-delay:0.8s;font-size:22px">✦</i><i class="tw" style="left:84%;top:70%;animation-delay:1.9s;font-size:18px">✦</i><i class="tw" style="left:30%;top:10%;animation-delay:1.4s;font-size:14px">✦</i><i class="tw" style="left:66%;top:8%;animation-delay:0.9s;font-size:16px">✦</i><i class="tw" style="left:48%;top:20%;animation-delay:2.1s;font-size:12px">✦</i><i class="tw" style="left:94%;top:30%;animation-delay:0.2s;font-size:14px">✦</i><div id="say" class="bubble"></div><div class="shadow"></div><div id="hero"></div>
 <div class="form"><input id="nm" class="inp" maxlength="20" placeholder="Как тебя зовут? (не обязательно)" value="${(P.name||"").replace(/"/g,"")}"><button class="play" onclick="enter()" aria-label="Играть"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M20 9 L55 32 L20 55 Z" fill="#ffc83d" stroke="#0a6a62" stroke-width="7" stroke-linejoin="round"/><path d="M20 9 L55 32 L20 55 Z" fill="#ffc83d" stroke="#ffe27a" stroke-width="2" stroke-linejoin="round"/></svg><span>Играть</span></button></div></div>`;
 hero("wave");say("Привет! Это Твинкл!");introVoice()}
async function enter(){
 const n=$("nm").value.trim();
 P.name=n;save();
 const r=await api("/check",{});
 if(blocked(r))return gate(r);
 home();afterHome()}
function blocked(r){
 if(!initData)return false;            // открыто не из Telegram: проверка невозможна
 if(r&&r.subscribed===true)return false;
 if(r&&r.subscribed===false)return true;
 return STRICT}                          // нет ответа или ошибка сервера
function why(r){
 if(!r)return "нет ответа от Worker (проверьте ALLOWED_ORIGIN и нажатие Deploy)";
 if(r.error==="unauthorized")return "Worker не принял данные Telegram (BOT_TOKEN не от этого бота или не сохранён)";
 if(r.subscribed===null)return "Telegram: "+(r.error||"не удалось проверить (бот должен быть админом канала)");
 return ""}
function gate(r){
 const d=(DEBUG&&r!==undefined&&why(r))?`<p class="center" style="font-size:11px;color:#999">${why(r).replace(/</g,"&lt;")}</p>`:"";
 frame(`<h1>Почти готово!</h1><p class="center">Чтобы пользоваться приложением, подпишитесь на наш канал. Мы очень ценим это ❤️</p>
  <button class="btn" onclick="openCh()">Открыть канал</button><button class="btn alt" onclick="recheck()">Я подписался(лась)</button>${d}`,false);
 hero("think");say("Подпишитесь, и начнём!")}
function openCh(){if(!CHANNEL_URL)return;tg&&tg.openTelegramLink?tg.openTelegramLink(CHANNEL_URL):window.open(CHANNEL_URL,"_blank")}
async function recheck(){const r=await api("/check",{});if(!blocked(r)){home();afterHome()}else{gate(r);hero("try_again");say("Пока не вижу подписки. Попробуйте ещё раз!")}}
async function boot(){
 const v=await cloud.get();
 if(v){try{const c=JSON.parse(v);if(c.name&&!P.name)P.name=c.name;if(P.wallet==null&&c.wallet!=null){P.wallet=c.wallet;P.own=c.own;P.eq=c.eq}if(c.streak&&(!P.streak||c.streak.last>P.streak.last)){P.streak=c.streak;P.freeze=c.freeze||0;P.daily=c.daily}
  if(c.v===2)for(const [k,x] of Object.entries(c.lessons||{})){const m=P.lessons[k];if(!m||(x.best||0)>(m.best||0))P.lessons[k]=x}}catch(e){}}
 if(P.wallet==null)P.wallet=bests("");P.own=P.own||{};P.eq=P.eq||{};applyBg();intro()}
boot();
</script>
